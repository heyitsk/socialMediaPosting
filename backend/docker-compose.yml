services:
  postgres:
    image: postgres:18
    container_name: smposting-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: smposting
      POSTGRES_PASSWORD: smposting
      POSTGRES_DB: smposting
    ports:
      - "5433:5432"
    volumes:
      - smposting_postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.0
    container_name: smposting-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - smposting_redis_data:/data

  n8n:
    # Pinned: built-in OpenTelemetry needs 2.19+, and it's still a preview
    # feature whose settings may change between versions.
    image: docker.n8n.io/n8nio/n8n:2.41.4
    container_name: smposting-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # Store binary files (images/videos) on disk instead of RAM — prevents
      # n8n from crashing on large video uploads.
      N8N_DEFAULT_BINARY_DATA_MODE: filesystem
      N8N_PAYLOAD_SIZE_MAX: 4000
      # Auto-delete old execution logs + binary files to prevent disk filling up.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 336
      N8N_EDITOR_BASE_URL: http://localhost:5678
      WEBHOOK_URL: http://localhost:5678
      # Must match backend's N8N_CALLBACK_SECRET — referenced by the
      # "Send Callback"/"Send Error Callback" nodes in each poster workflow.
      CALLBACK_SECRET: 10eae92593ffa51821599943e5cc48f52a96a0666f39f6e46e1976321f12b1b2
      # n8n blocks {{ $env.* }} access in node expressions by default (security
      # hardening) — required here since our callback nodes read $env.CALLBACK_SECRET.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Tracing (websitePlan.md §14.5). n8n continues the traceparent the
      # backend sends with each dispatch, adds a span per node, and passes it
      # on in the callback request, so one trace covers the whole post.
      N8N_OTEL_ENABLED: "true"
      N8N_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      N8N_OTEL_EXPORTER_SERVICE_NAME: smposting-n8n
    volumes:
      - n8n_data:/home/node/.n8n

  # Local observability backend (websitePlan.md §14): an OTLP collector feeding
  # Tempo (traces), Loki (logs) and Prometheus (metrics), with Grafana on top.
  # Dev only — production sends the same OTLP to Grafana Cloud. Point the
  # backend at it with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318.
  otel-lgtm:
    image: grafana/otel-lgtm:0.11.10
    container_name: smposting-otel-lgtm
    restart: unless-stopped
    ports:
      - "3001:3000" # Grafana (admin/admin); host 3000 is often taken
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    # No volume: local telemetry is throwaway and resets with the container.

volumes:
  smposting_postgres_data:
  smposting_redis_data:
  n8n_data:
    external: true
